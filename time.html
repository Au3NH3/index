<!DOCTYPE html>
<!-- <html lang='zh-CN'> -->
<html>
<head>
	<meta charset="utf-8" />
	<meta name="author" content="auiii">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!--<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />-->
	<title>time</title>
	<style>
		body {
			background-color: #cec6;
			font-size: 18px;
			/*width:fit-content;*/
			margin: auto;
			text-align: center;
		}
		#content{
			/*margin: 20px 0;*/
			min-height: 400px;
		}
		#date {
			/*display: inline-block;*/
			margin: 4em 0 3em 0;
			font-size:1.5em;
		}
		.center{margin:auto;}
		.time {
			font-size: 1.5em;
			padding-left: 1em;
		}
		#time-diff {
			/*margin-top: 1em;*/
			height: 1.3em;
		}
		.p{
			margin:0.5em 0;
		}
		/*td{padding:1em;}*/
		/*hr {width: 80%;}*/
		/*a:visited{color:blue}*/
		a{
			color: dodgerblue;
			text-decoration:none;
		}
		a:hover{text-decoration:underline;}
		button {
			color: dodgerblue;
			background: none;
			border: none;
			font-size: 1em;
			margin: 1em;
			cursor: pointer
		}
		/*button:hover{cursor:pointer;}*/
		.rainbow {
			min-height: 2em;
			padding: 1em initial;
			background:linear-gradient(to right, 
				red,orange,yellow,green,blue,indigo,violet);
		}

		@media (max-width: 500px) {
			#date {
				font-size: 22px;
			}
		}
	</style>
	<style>
		body {
			background-color: dimgrey;
			color: azure;
		}
		a, button {
			color: #adf;
		}
	</style>
</head>
<body>
	<div id='content'>
		<h3 id='date'>2022 年 3 月 4 日 &emsp;星期五</h3>
		<table class='center'>
			<tr><td>本地时间</td> <td class='time' id="time"   >12:34:56</td></tr>
			<tr><td>北京时间</td> <td class='time' id="ntptime">获取中..</td></tr>
		</table>
		<br>
		<div class='p' id='time-diff'></div>
		<div class='p'>时区&emsp;<span id='zone'></span></div>
		<div class='p'>网络延时&emsp;<span id='latency'>正在连接...</span></div>
		<button type='button' onclick='location.reload()'>刷新&#x27f3;</button>
		<!-- 旧符号🗘&#x1f5d8; 安卓不支持5位unicode -->
		<button type='button' id='switchbg'>切换背景&#x21cc;</button>
	</div>
	<!-- <hr/> -->
	<div class='rainbow'></div>
    <div id='footer'>
		<div class='p'>copyright &copy <a>anonymous</a></div>
		<div class='p'><a href='index.html'>返回首页⌂</a></div>
	</div>
	<script src="time.js"></script>
	<script>
		const e_switch = document.querySelector('#switchbg');
		const style = document.styleSheets[1];

		// localStorage返回字符串, +'0'=0
		// 未定义变量: getItem返回null, .item返回undefined
		if (+localStorage.theme) {
			style.disabled = true;
		}
		e_switch.addEventListener('click', ()=>{
			style.disabled = !style.disabled;
			//初始值null, 1-null=1; 1-'1'=0; 1-'0'=1
			localStorage.theme = 1 - localStorage.getItem('theme');
		})
	</script>
</body>
</html>
